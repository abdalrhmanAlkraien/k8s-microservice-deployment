# {{- $podName := include "document-service-chart.podName" . }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name:  {{ .Values.document-app.deployment.labels.name }}
  namespace: {{ .Values.document-app.namespace }}
  labels:
    app: {{-include "document-app.labels.app" . -}}
    owner: {{-include "document-app.labels.owner" . -}}
    env: {{-include "document-app.labels.env" . -}}
spec:
  replicas: {{ .Values.document-app.deployment.replicas }}
  selector:
    matchLabels:
      app:  {{ $podName }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: {{ .Values.document-app.deployment.strategy.type }}
  template:
    metadata:
      labels:
        app: {{ $podName }}
        owner: {{ .Values.document-app.labels.owner }}
        env: {{ .Values.document-app.labels.env }}
    spec:
      # restartPolicy: Always
      containers:
      - image:  {{ include "document-app.deployment.image.fullname" . | quote }}
        imagePullPolicy: {{ .Values.document-app.deployment.image.imagePullPolicy }} # could be Always, IfNotPresent, and Never
        name: {{ .Values.document-app.deployment.image.container-name }}
        resources:
          limits: 
            cpu: "500m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        envFrom:
          - configMapRef:
              name: document-app-map
          - secretRef:
              name: document-app-secret
        livenessProbe:
          httpGet:
            path: /api/v1/actuator/health/liveness
            port: {{ .Values.document-app.deployment.expose-port }}
          initialDelaySeconds: 120
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 10

        readinessProbe:
          httpGet:
            path: /api/v1/actuator/health/readiness
            port: {{ .Values.document-app.deployment.expose-port }}
          initialDelaySeconds: 100
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 10      
        ports:
        - containerPort:  {{ .Values.document-app.deployment.expose-port }}
          name:  expose-port
        volumeMounts:
        - mountPath: /data
          name: data
      volumes:
        - name: data
          emptyDir: {}

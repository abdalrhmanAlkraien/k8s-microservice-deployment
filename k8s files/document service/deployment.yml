apiVersion: apps/v1
kind: Deployment
metadata:
  name:  document-app
  namespace: micro-app
  labels:
    app:  document-app
    env: dev
    owner: abdalrhmanAlkraien
spec:
  replicas: 2
  selector:
    matchLabels:
      app:  document-pod 
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app:  document-pod
        owner: abdalrhman
        env: dev
    spec:
      restartPolicy: Always
      containers:
      - image:  abdalrhmanalkraien/document-service:1.0.6
        imagePullPolicy: IfNotPresent # could be Always, IfNotPresent, and Never
        name:  document-service
        resources:
          limits: 
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "20m"
            memory: "55M"
        env: 
          - name:  SPRING_DATASOURCE_URL
            value: jdbc:mysql://db-service-app.micro-app.svc.cluster.local:3306/report-service?autoReconnect=true&useUnicode=true&character
          - name: _JAVA_OPTIONS
            value: -Xmx2048m -Xms256m
        # livenessProbe:
        #   httpGet:
        #     path: /_status/healthz
        #     port: 5000
        #   initialDelaySeconds: 90
        #   timeoutSeconds: 10
        # readinessProbe:
        #   httpGet:
        #     path: /_status/healthz
        #     port: 5000
        #   initialDelaySeconds: 30
        #   timeoutSeconds: 10      
        ports:
        - containerPort:  8090
          name:  expose-port
      #   volumeMounts:
      #   - mountPath: /data
      #     name: data
      # volumes:
      #   - name: data
      #     emptyDir: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name:  document-app
  namespace: micro-app
  labels:
    app:  document-app
    env: dev
    owner: abdalrhmanAlkraien
spec:
  replicas: 2
  selector:
    matchLabels:
      app:  document-pod 
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app:  document-pod
        owner: abdalrhman
        env: dev
    spec:
      # restartPolicy: Always
      containers:
      - image:  abdalrhmanalkraien/document-service:1.0.10
        imagePullPolicy: IfNotPresent # could be Always, IfNotPresent, and Never
        name:  document-service
        resources:
          limits: 
            cpu: "500m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        envFrom:
          - configMapRef:
              name: document-app-map
          - secretRef:
              name: document-app-secret
        env:
          - name: JAVA_TOOL_OPTIONS
            value: "-Xms256m -Xmx1024m"
        livenessProbe:
          httpGet:
            path: /api/v1/actuator/health/liveness
            port: 8090
          initialDelaySeconds: 120
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 10

        readinessProbe:
          httpGet:
            path: /api/v1/actuator/health/readiness
            port: 8090
          initialDelaySeconds: 100
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 10      
        ports:
        - containerPort:  8090
          name:  expose-port
        volumeMounts:
        - mountPath: /data
          name: data
      volumes:
        - name: data
          emptyDir: {}

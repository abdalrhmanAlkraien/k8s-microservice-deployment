apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: arb-ci-pipeline
  namespace: micro-app

spec:
  params:
    - name: git-url
      type: string
      description: the repository url.
    - name:  image-url
      type: string
      description: the docker image url.
    - name: revision
      type: string
      description: the branch name.
    - name: DOCKERFILE
      type: string
      description: docker file location inside the git.
    - name: CONTEXT
      type: string
      description: the work load.
    - name: release-name
      type: string
      description: name of the realese.
    - name: chart-path
      type: string
      description: helm chart location inside the git.
    - name: app-name 
      type: string
      description: application name
  workspaces:
    - name: shared-workspace
    - name: maven-settings
    - name: docker-secret
  tasks:
    - name: clone-repo
      taskRef:
        name:  git-clone
      workspaces: 
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
    - name: maven-build
      runAfter: [clone-repo]
      taskRef:
        name: maven-build
      workspaces:
        - name: settings
          workspace: maven-settings
        - name: source
          workspace: shared-workspace
    - name: docker-build-push
      runAfter: [maven-build]
      taskRef:
        name: docker-build-push
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: docker-secret
          workspace: docker-secret
      params:
        - name: IMAGE
          value: $(params.image-url)
        - name: DOCKERFILE
          value: $(params.DOCKERFILE)
        - name: CONTEXT
          value: $(params.CONTEXT)
    - name: argos-sync
      runAfter: [docker-build-push]
      taskRef:
        name: argocd-sync-task
      params: 
        - name: app-name
          value: $(params.app-name)


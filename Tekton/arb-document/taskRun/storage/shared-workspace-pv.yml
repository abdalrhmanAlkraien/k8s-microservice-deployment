apiVersion: v1
kind: PersistentVolume
metadata:
  name:  shared-pv
spec:
  capacity:
    storage: 512Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: "/mnt/data/shared"
  nodeAffinity:
    required: 
      nodeSelectorTerms: 
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
              - worker-node-2

apiVersion: tekton.dev/v1
kind: Task
metadata: 
  name: deploy-helm
  namespaces: tekton-pipelines
spec: 
  params:
    - name: release-name
      type: string
    - name: chart-path
      type: string
      default: ./helm
    - name: namespace
      type: string
      default: default
  workspace:
    - name: source
      description: workspace with the helm chart and the app code.
  steps:
    - name:  deploy
      image: alpine/helm:3.13.2
      workingDir: $(workspaces.source.path)/source
      script: |
        #!/bin/sh
        echo "Deploying Helm release..."
        helm upgrade --install $(params.release-name) $(params.chart-path)  --namespace $(params.namespace) --create-namespace

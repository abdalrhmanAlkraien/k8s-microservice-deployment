apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: document-service-template
  namespace: micro-app
spec:
  params:
    - name: git-url
    - name: image-url
    - name: revision
    - name: DOCKERFILE
    - name: CONTEXT
    - name: release-name
    - name: chart-path
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata: 
        generateName: document-service-run-
        namespace: micro-app
      spec: 
        pipelineRef:
          name: arb-ci-pipeline
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: image-url
            value: $(tt.params.image-url)
          - name: revision
            value: $(tt.params.revision)
          - name: DOCKERFILE
            value: $(tt.params.DOCKERFILE)
          - name: CONTEXT
            value: $(tt.params.CONTEXT)
          - name: release-name
            value: $(tt.params.release-name)
          - name: chart-path
            value: $(tt.params.chart-path)
        workspaces:
          - name: shared-workspace
            persistentVolumeClaim:
              claimName: shared-pvc
          - name: docker-secret
            secret:
              secretName: docker-secret
          - name: maven-settings
            configMap:
              name: maven-settings
      podTemplate:
        nodeSelector:
          kubernetes.io/hostname: worker-node-2
        tolerations:
          - key: "node-type"
            operator: "Equal"
            value: "ci"
            effect: "NoSchedule"
     

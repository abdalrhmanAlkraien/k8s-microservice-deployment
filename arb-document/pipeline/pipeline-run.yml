apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata: 
  name:  arb-ci-run
  namespace: micro-app
spec: 
#  ttlSecondsAfterFinished: 300
#  serviceAccountName: pipeline-sa
  pipelineRef: 
    name: arb-ci-pipeline
  params: 
    - name: url
      value: https://github.com/Aswarya-cloud/poc-report.git
    - name: image-url
      value: docker.io/abdalrhmanalkraien/arb-report:latest
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: shared-pvc
    - name: docker-secret
      secret:
        secretName: docker-secret
    - name: maven-settings
      configMap:
        name: maven-settings

  podTemplate:
    nodeSelector:
      kubernetes.io/hostname: worker-node-2
    tolerations:
      - key: "node-type"
        operator: "Equal"
        value: "ci"
        effect: "NoSchedule"

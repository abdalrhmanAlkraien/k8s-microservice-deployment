# Deployment

# define the app name
name: document-service-app

document-app:
  namespace: micro-app
  labels:
    owner: abdalrhman
    env: dev
    app: document-service
    pod-name: document-pod
  deployment:
    labels:
      name: document-app
    replicas: 2
    image:
      repository: abdalrhmanalkraien
      image-name: document-service
      image-version: 1.0.10
      imagePullPolicy: IfNotPresent # could be Always, IfNotPresent, and Never
      container-name: document-service
    expose-port: 8090
    strategy:
      type: RollingUpdate

  env:
    configMapRef: document-app-map
    secretRef: document-app-secret

  #Service
  service:
    labels:
      name: document-service-app
    port:
      listener-port: 8090
      expose-port: 8085

#ingress

#Configkey 
  configMap:
    data:
      data.url: "jdbc:mysql://db-service-app.micro-app.svc.cluster.local:3306/report-service?autoReconnect=true&useUnicode=true&character"
      _JAVA_OPTIONS: "-Xmx2048m -Xms256m"
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1024m"
      profile.active: dev

#Secret key
  secret: 
    data:
      data.username: adminUser
      data.password: AdminPassword

# pv voulme
  pv:
    storage: 5Gi
    path: "/mnt/data/db"
    accessMode: ReadWriteOnce

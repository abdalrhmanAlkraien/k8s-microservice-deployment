apiVersion: v1
kind: ConfigMap
metadata:
  name:  {{ include "app.name" .}}
  namespace: {{ index .Values.namespace }}
  labels:
    {{ include "common.labels" . | nindent 4 }}
data:
  data.url: {{ index .Values "document-app" "configMap" "data" "data.url"}}
  _JAVA_OPTIONS: {{ index .Values "document-app" "configMap" "data" "_JAVA_OPTIONS"}}
  JAVA_TOOL_OPTIONS: {{ index .Values "document-app" "configMap" "data" "JAVA_TOOL_OPTIONS"}}
  profile.active: {{ index .Values "document-app" "configMap" "data" "profile.active"}}
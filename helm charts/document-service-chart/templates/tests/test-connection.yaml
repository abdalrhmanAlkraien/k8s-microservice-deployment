apiVersion: v1
kind: Pod
metadata:
  name: {{ include "document-service.app.name" .}}
  labels:
    {{- include "document-app.labels" . | nindent 4 }}

  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "document-service.app.name" . }}:{{ index .Values "document-app" "deployment" "expose-port" }}']
  restartPolicy: Never

apiVersion: v1
kind: Service
metadata:
  name:  {{ include "app.name" .}}
  namespace: {{ index .Values.namespace }}
  labels:
    {{ include "common.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "app.name" .}}
  type: ClusterIP
  ports:
    - name: external-port
      port: {{ index .Values "document-app" "service" "port" "expose-port" }}
      targetPort: {{ index .Values "document-app" "service" "port" "listener-port" }}

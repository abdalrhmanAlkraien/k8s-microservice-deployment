apiVersion: v1
kind: Secret
metadata:
  name:  {{ include "app.name" .}}
  namespace: {{ index .Values.namespace }}
  labels:
    {{ include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
  data.username: {{ index .Values "document-app" "secret" "data" "data.username"}}
  data.password: {{ index .Values "document-app" "secret" "data" "data.password"}}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "document-db.app.name" .}}
  namespace: {{ index .Values "document-db" "namespace" }}
  labels:
    {{ include "common.labels" . | nindent 4 }}
spec:
  selector:
    app:  {{ include "document-db.app.name" .}}
  type:  NodePort
  ports:
  - name:  internal-access-port
    port:  {{ index .Values "document-db" "service" "port" "expose-port"}}
    targetPort:  {{ index .Values "document-db" "service" "port" "listener-port"}}
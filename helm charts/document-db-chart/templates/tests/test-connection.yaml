apiVersion: v1
kind: Pod
metadata:
  name: {{ include "document-db.app.name" .}}
  labels:
    {{- include "common.labels" . | nindent 4 }}

  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "document-db.app.name" . }}:{{ index .Values "document-db" "deployment" "expose-port" }}']
  restartPolicy: Never

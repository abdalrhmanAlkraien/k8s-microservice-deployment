apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "document-db.app.name" .}}
  namespace: {{ index .Values "document-db" "namespace" }}
  labels:
    {{ include "common.labels" . | nindent 4 }}
data:
  MYSQL_DATABASE: {{ index .Values "document-db" "configMap" "data" "MYSQL_DATABASE" }}
  MYSQL_EXTRA_FLAGS: {{ index .Values "document-db" "configMap" "data" "MYSQL_EXTRA_FLAGS" }}

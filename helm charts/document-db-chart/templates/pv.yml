apiVersion: v1
kind: PersistentVolume
metadata:
  name:  {{ include "app.name" .}}
  namespace: {{ index .Values.namespace }}
  labels:
    {{ include "common.labels" . | nindent 4 }}
spec: 
  capacity: 
    storage: {{ index .Values "document-db" "pv" "storage"}}
  accessModes: 
    - {{ index .Values "document-db" "pv" "accessMode"}} 
  persistentVolumeReclaimPolicy: Retain # keep the data safe after delete the pvc
  storageClassName: ""
  hostPath:
    path: {{ index .Values "document-db" "pv" "path"}}
  

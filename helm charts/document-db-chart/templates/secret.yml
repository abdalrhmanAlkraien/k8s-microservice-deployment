apiVersion: v1
kind: Secret
metadata:
  name:  {{ include "app.name" .}}
  namespace: {{ index .Values.namespace }}
  labels:
    {{ include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_USER: {{ index .Values "document-db" "secret" "data" "MYSQL_USER" }}
  MYSQL_PASSWORD: {{ index .Values "document-db" "secret" "data" "MYSQL_PASSWORD" }}
  MYSQL_ROOT_PASSWORD: {{ index .Values "document-db" "secret" "data" "MYSQL_ROOT_PASSWORD" }}



apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name:  {{ include "app.name" .}}
  namespace: {{ index .Values.namespace }}
  labels:
    {{ include "common.labels" . | nindent 4 }}

spec:
  accessModes:
    - {{ index .Values.nexus.pv.accessMode}}
  resources:
    request:
      storage: {{ .Values.nexus.pv.storage }}
  storageClassName: ""
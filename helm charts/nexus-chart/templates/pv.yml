apiVersion: v1
kind: PersistentVolume
metadata:
  name:  {{ include "app.name" .}}
  namespace: {{ index .Values.namespace }}
  labels:
    {{ include "common.labels" . | nindent 4 }}

spec:
  capacity:
    storage: {{ .Values.nexus.pv.storage }}
  accessModes:
    - {{ index .Values "nexus" "pv" "accessMode"}}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: {{ index .Values "nexus" "pv" "path"}}
